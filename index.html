function fmt(sec){sec=Number(sec)||0;return Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0')}
function coverFor(t){return t.cover||t.artwork||'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=500&q=70'}
function renderHome(){const name=user?.displayName?.split(' ')[0]||'there';const liked=state.liked;const mixes=[['Hindi Hits','Bollywood • Hindi'],['Punjabi Vibes','Punjabi • Desi'],['Urdu Nights','Urdu • Pakistani'],['Global Pulse','Worldwide • Fresh']];$('main').innerHTML=`<div class="hero glass"><div class="eyebrow">${new Date().getHours()<12?'GOOD MORNING':new Date().getHours()<18?'GOOD AFTERNOON':'GOOD EVENING'}</div><h1>Hey ${esc(name)}.</h1><p>A clean, calm music space built for listening—not loading screens.</p></div><section class="section"><div class="sectionHead"><h2>Made For You</h2><span>Quick mixes</span></div><div class="quickGrid">${mixes.map((m,i)=>`<button class="mix" data-mix="${i}"><div><b>${m[0]}</b><span>${m[1]}</span></div></button>`).join('')}</div></section><section class="section"><div class="sectionHead"><h2>Trending Hits</h2><span>Open catalog</span></div><div id="trending" class="horizontal"><div class="loading" style="min-width:100%"><div class="spinner"></div>Loading music</div></div></section><section class="section"><div class="sectionHead"><h2>Your Liked Tracks</h2><span>${liked.length} saved</span></div><div class="likedWrap">${liked.length?liked.slice(0,8).map(trackRow).join(''):`<div class="card empty">Tap ♡ on any track and it will appear here.</div>`}</div></section><section class="section"><div class="sectionHead"><h2>Recently Played</h2><span>${state.history.length}</span></div><div class="likedWrap">${state.history.length?state.history.slice(0,5).map(trackRow).join(''):`<div class="card empty">Your listening history will appear here.</div>`}</div></section>`;document.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{const q=['Hindi','Punjabi','Urdu Pakistani','global electronic'][+b.dataset.mix];state.search=q;showTab('search');setTimeout(()=>doSearch(q),30)});loadTrending()}
function trackRow(t){const k=esc(t.key||t.id);return `<div class="row" data-key="${k}" role="button" tabindex="0" aria-label="Play ${esc(t.title)}"><img class="thumb" src="${esc(coverFor(t))}" onerror="this.src='https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=200&q=60'" alt=""><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist||'Unknown artist')} • ${fmt(t.duration)} • ${esc(t.source||'Music')}</span></div><div class="actions"><button class="iconBtn heart ${isLiked(t)?'on':''}" data-like="${k}" aria-label="Like">${isLiked(t)?'♥':'♡'}</button><button class="iconBtn playBtn" data-play="${k}" aria-label="Play">▶</button></div></div>`}
function wireRows(root=document){root.querySelectorAll('.row[data-key]').forEach(row=>{const play=()=>{const t=findTrack(row.dataset.key);if(t)playTrack(t)};row.onclick=e=>{if(e.target.closest('[data-like],[data-play]'))return;play()};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();play()}}});root.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=findTrack(b.dataset.play);if(t)playTrack(t)});root.querySelectorAll('[data-like]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=findTrack(b.dataset.like);if(t)toggleLike(t)})}
function findTrack(key){return [...state.results,...state.liked,...state.history,...state.queue].find(t=>(t.key||t.id)===key)||null}
async function loadTrending(){const box=$('trending');if(!box)return;try{const data=await fetchJson('https://api.audius.co/v1/tracks/trending?limit=12',4000);const arr=(data.data||[]).map(normalizeAudius);state.queue=arr;box.innerHTML=arr.length?arr.map(t=>`<button class="trend" data-trend="${esc(t.key)}"><img class="cover" src="${esc(coverFor(t))}" alt=""><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></button>`).join(''):`<div class="empty">No trending tracks right now.</div>`;box.querySelectorAll('[data-trend]').forEach(b=>b.onclick=()=>{const t=findTrack(b.dataset.trend);if(t)playTrack(t)})}catch(e){box.innerHTML='<div class="card empty" style="min-width:100%">Trending is temporarily unavailable. Search still works.</div>'}}
function fetchJson(url,ms){return new Promise((resolve,reject)=>{const c=new AbortController();const timer=setTimeout(()=>{c.abort();reject(new Error('timeout'))},ms);fetch(url,{signal:c.signal,cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{clearTimeout(timer);resolve(x)}).catch(e=>{clearTimeout(timer);reject(e)})})}
function normalizeAudius(x){const art=x.artwork?.['480x480']||x.artwork?.['150x150']||x.artwork?.['1000x1000']||'';return {key:'aud:'+x.id,id:x.id,title:x.title||'Untitled',artist:x.user?.name||'Audius artist',cover:art,duration:x.duration||0,source:'Audius',stream:`https://api.audius.co/v1/tracks/${encodeURIComponent(x.id)}/stream`}}
function normalizeITunes(x){return {key:'itunes:'+x.trackId,id:String(x.trackId),title:x.trackName||'Untitled',artist:x.artistName||'Unknown artist',cover:x.artworkUrl100?.replace('100x100','600x600')||'',duration:(x.trackTimeMillis||0)/1000,source:'Apple Music Preview',stream:x.previewUrl||''}}
async function searchAudius(q){const d=await fetchJson('https://api.audius.co/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=20&offset=0',4500);return (d.data||[]).map(normalizeAudius)}
async function searchITunes(q){const d=await fetchJson('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&entity=song&limit=20',4500);return (d.results||[]).filter(x=>x.previewUrl).map(normalizeITunes)}
function renderSearch(){ $('main').innerHTML=`<div class="pageTitle">Search</div><div class="searchBox"><input id="searchInput" value="${esc(state.search)}" placeholder="Search Hindi, Punjabi, global music…"><button id="searchGo" class="searchGo">⌕</button></div><div class="pills">${['Trending','Hindi','Punjabi','Pakistani','Urdu','Lo-Fi','Global'].map((x,i)=>`<button class="pill ${state.search.toLowerCase()===x.toLowerCase()?'active':''}" data-q="${x}">${x}</button>`).join('')}</div><div id="results" class="results"></div>`;const input=$('searchInput');$('searchGo').onclick=()=>doSearch(input.value.trim());input.onkeydown=e=>{if(e.key==='Enter')doSearch(input.value.trim())};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;doSearch(b.dataset.q)});if(state.results.length)renderSearchResults(state.results);else if(state.search)doSearch(state.search);else $('results').innerHTML='<div class="card empty">Search for a song, artist, language, or genre.</div>'}
async function doSearch(q){q=q.trim();if(!q)return;$('searchInput').value=q;state.search=q;const box=$('results');box.innerHTML='<div class="loading"><div class="spinner"></div>Finding playable music…</div>';let a=[],b=[];const p1=searchAudius(q).catch(()=>[]),p2=searchITunes(q).catch(()=>[]);[a,b]=await Promise.all([p1,p2]);const seen=new Set();state.results=[...a,...b].filter(t=>{if(!t.stream||seen.has(t.title.toLowerCase()+'|'+t.artist.toLowerCase()))return false;seen.add(t.title.toLowerCase()+'|'+t.artist.toLowerCase());return true}).slice(0,30);renderSearchResults(state.results)}
function renderSearchResults(arr){const box=$('results');if(!box)return;box.innerHTML=arr.length?arr.map(trackRow).join(''):'<div class="card empty">No playable results found. Try another spelling or genre.</div>';wireRows(box)}
async function resolveAudiusStream(t){const urls=[`https://api.audius.co/v1/tracks/${encodeURIComponent(t.id)}/stream`,`https://discoveryprovider.audius.co/v1/tracks/${encodeURIComponent(t.id)}/stream`];for(const u of urls){try{const r=await fetch(u,{method:'GET',redirect:'follow'});if(r.ok)return r.url}catch(e){}}return null}
async function playTrack(t){if(!t)return;state.current=t;state.queue=state.results.length?state.results:[...state.queue];state.queueIndex=Math.max(0,state.queue.findIndex(x=>(x.key||x.id)===(t.key||t.id)));updatePlayer();saveHistory(t);audio.pause();audio.removeAttribute('src');audio.load();$('miniPlay').textContent='…';$('mainPlay').textContent='…';$('mini').classList.add('show');let candidates=[];if(t.stream)candidates.push(async()=>t.stream);if(t.source==='Audius')candidates.push(()=>resolveAudiusStream(t));let ok=false;for(const get of candidates){try{const url=await Promise.race([get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('source timeout')),4500))]);if(!url)continue;audio.src=url;audio.load();await audio.play();ok=true;break}catch(e){console.warn('play source failed',e)}}if(!ok){$('miniPlay').textContent='▶';$('mainPlay').textContent='▶';toast('Is source ko browser play nahi kar pa raha. Dusra result try karo.');return}$('miniPlay').textContent='❚❚';$('mainPlay').textContent='❚❚';}
function updatePlayer(){const t=state.current;if(!t)return;$('miniArt').src=coverFor(t);$('miniTitle').textContent=t.title;$('miniArtist').textContent=t.artist;$('bigArt').src=coverFor(t);$('nowTitle').textContent=t.title;$('nowArtist').textContent=t.artist}
function nextTrack(dir=1){if(!state.queue.length)return;state.queueIndex=(state.queueIndex+dir+state.queue.length)%state.queue.length;playTrack(state.queue[state.queueIndex])}
$('miniPlay').onclick=async()=>{if(audio.paused){try{await audio.play();$('miniPlay').textContent='❚❚';$('mainPlay').textContent='❚❚'}catch(e){toast('Tap Play again after choosing a track.')}}else audio.pause()};$('mainPlay').onclick=()=>$('miniPlay').click();$('prevBtn').onclick=()=>nextTrack(-1);$('nextBtn').onclick=()=>nextTrack(1);$('miniOpen').onclick=()=>{$('playerShade').classList.add('show');updatePlayer()};$('closePlayer').onclick=()=>$('playerShade').classList.remove('show');audio.onplay=()=>{$('miniPlay').textContent='❚❚';$('mainPlay').textContent='❚❚'};audio.onpause=()=>{$('miniPlay').textContent='▶';$('mainPlay').textContent='▶'};audio.onwaiting=()=>{};audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;$('progress').style.width=p+'%'};audio.onended=()=>nextTrack(1);audio.onerror=()=>{if(state.current){$('miniPlay').textContent='▶';$('mainPlay').textContent='▶';toast('Audio source ended or was blocked by the browser.')}};
function setupAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaElementSource(audio);gain=audioCtx.createGain();bass=audioCtx.createBiquadFilter();mid=audioCtx.createBiquadFilter();treble=audioCtx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=120;mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.7;treble.type='highshelf';treble.frequency.value=5000;source.connect(bass).connect(mid).connect(treble).connect(gain).connect(audioCtx.destination);applyPreset(state.preset)}catch(e){console.warn('Web Audio unavailable',e)}}
function applyPreset(p){state.preset=p;localStorage.setItem('muzo_preset',p);if(!bass||!mid||!treble)return;const m={Flat:[0,0,0],['Bass Boost']:[7,1,1],['Vocal Booster']:[-2,5,3],Treble:[1,1,7],Rock:[5,2,5],Pop:[3,3,4]};const v=m[p]||m.Flat;bass.gain.value=v[0];mid.gain.value=v[1];treble.gain.value=v[2];renderSettings()}
function renderSettings(){$('main').innerHTML=`<div class="pageTitle">Settings</div><div class="settings"><div class="setting glass account"><div class="bigAvatar">${user?.photoURL?`<img src="${esc(user.photoURL)}" alt="">`:'U'}</div><div class="meta"><b>${esc(user?.displayName||'MUZO User')}</b><span>${esc(user?.email||'Signed in')}</span></div><button class="logout" id="logout">Log out</button></div><div class="setting glass"><h3>Audio Quality</h3><p>Playback preference. MUZO uses the best quality the selected catalog source provides; it cannot upgrade a low-quality source into HD.</p><div class="quality">${['128 kbps','320 kbps','Lossless HD'].map(q=>`<button class="seg ${state.quality===q?'active':''}" data-quality="${q}">${q}</button>`).join('')}</div></div><div class="setting glass"><h3>Equalizer</h3><p>Real-time Web Audio gain controls are applied after playback starts.</p><div class="presetGrid">${['Flat','Bass Boost','Vocal Booster','Treble','Rock','Pop'].map(p=>`<button class="preset ${state.preset===p?'active':''}" data-preset="${p}">${p}</button>`).join('')}</div></div><div class="setting glass"><h3>Performance</h3><p>MUZO starts audio processing only after a user taps Play, preventing startup crashes and unnecessary battery/network use.</p></div></div>`;document.querySelectorAll('[data-quality]').forEach(b=>b.onclick=()=>{state.quality=b.dataset.quality;localStorage.setItem('muzo_quality',state.quality);audio.preload=state.quality==='Lossless HD'?'auto':'metadata';toast(state.quality+' preference saved');renderSettings()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{setupAudio();if(audioCtx?.state==='suspended')audioCtx.resume().catch(()=>{});applyPreset(b.dataset.preset)});$('logout').onclick=async()=>{try{await auth.signOut()}catch(e){toast('Could not log out')}}}
function showTab(tab){state.tab=tab;document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')renderHome();if(tab==='search')renderSearch();if(tab==='settings')renderSettings()}
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('avatar').onclick=()=>showTab('settings');
window.addEventListener('error',e=>{console.error('MUZO runtime error',e);if($('splash')&&!$('splash').classList.contains('hidden'))hideSplash()});
window.addEventListener('unhandledrejection',e=>console.warn('MUZO promise',e.reason));
// Boot: Firebase decides whether to show the login wall or the app. No Home/API work runs before auth resolves.
(async()=>{try{const ready=initFirebase();if(!ready)showAuth()}catch(e){console.error(e);showAuth()}})();
</script>
</body>
