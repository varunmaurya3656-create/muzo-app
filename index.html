<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <title>MUZO – Music, beautifully personal.</title>

  <!-- Custom Logo Direct URL Link Integration -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/hxnwJYr2/logo.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/hxnwJYr2/logo.png">
  
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "MUZO Music",
    "short_name": "MUZO",
    "start_url": "/",
    "display": "standalone",
    "background_color": "#030712",
    "theme_color": "#0a1128",
    "icons": [
      {
        "src": "https://i.ibb.co/hxnwJYr2/logo.png",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "https://i.ibb.co/hxnwJYr2/logo.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <!-- PWA Service Worker Engine -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swContent = `
          self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swContent], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Reg Error:', err));
      });
    }
  </script>

  <style>
    :root{--bg:#0e1014;--bg2:#171a20;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.08);--accent:#fff;--text:#f3f4f6;--muted:#9ca3af}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#080a0e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 10% 10%,#1c2028,#07090d 50%,#040507);pointer-events:none}
    .glass,.card,.header,.bottomNav,.mini,.modalSheet,.searchBox,.row,.mix,.trend,.loginCard,.profileCard,.setting,.pill,.subCard{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:20px}
    .app{width:min(100%,480px);min-height:100dvh;margin:0 auto;padding:14px 12px calc(112px + env(safe-area-inset-bottom));position:relative;box-sizing:border-box}
    .hero{padding:20px;min-height:150px;overflow:hidden;position:relative}.hero:before{content:"";position:absolute;width:180px;height:180px;background:rgba(255,255,255,.08);filter:blur(50px);top:-40px;right:-30px;border-radius:50%}
    .searchBox{display:flex;align-items:center;padding:6px 7px 6px 15px;margin-bottom:11px}.searchBox input{border:0;background:0 0;outline:0;color:#fff;width:100%;font-size:15px}
    .settings{display:grid;gap:12px}.setting{padding:16px}.setting h3{margin:0 0 6px;font-size:15px}.setting p{margin:0;color:var(--muted);font-size:13px}
    .bottomNav{position:fixed;z-index:40;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),456px);height:66px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;gap:6px;background:rgba(18,21,27,.82)}
    .playerShade,.modalShade{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:50;display:none}
    @media(min-width:700px){body{background:#07090d}.app{box-shadow:0 0 100px #0007}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="https://i.ibb.co/hxnwJYr2/logo.png" alt="MUZO" style="width:36px;height:36px;border-radius:10px;object-fit:cover;">
        <span style="font-weight:bold;font-size:18px;letter-spacing:1px;">MUZO</span>
      </div>
      <button onclick="installPWA()" id="pwaInstallBtn" style="background:#fff;color:#000;border:0;padding:8px 14px;border-radius:12px;font-weight:bold;font-size:12px;cursor:pointer;display:none;">INSTALL APP</button>
    </header>

    <main id="mainContent">
      <div class="hero glass" style="margin-bottom:16px;">
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Good Evening</div>
        <h1 style="margin:4px 0 8px;font-size:24px;">Hey Varun.</h1>
        <p style="margin:0;color:var(--muted);font-size:13px;">A clean, calm music space built for listening.</p>
      </div>

      <div style="margin-bottom:20px;">
        <h3 style="font-size:16px;margin-bottom:12px;">Made For You</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="card" style="padding:14px;">
            <strong style="display:block;font-size:14px;">Hindi Hits</strong>
            <span style="font-size:11px;color:var(--muted);">Bollywood • Hindi</span>
          </div>
          <div class="card" style="padding:14px;">
            <strong style="display:block;font-size:14px;">Punjabi Vibes</strong>
            <span style="font-size:11px;color:var(--muted);">Punjabi • Desi</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'block';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('pwaInstallBtn').style.display = 'none';
        });
      }
    }
  </script>
</body>
</html>
